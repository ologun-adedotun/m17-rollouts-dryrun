replicaCount: 2

image:
  repository: maright-app
  tag: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []

config:
  APP_NAME: maright-app
  GREETING: Hello from the chart
  LOG_LEVEL: INFO
  READY_AFTER_SECONDS: "5"

service:
  port: 80

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 250m
    memory: 128Mi

podDisruptionBudget:
  enabled: true
  minAvailable: 1

networkPolicy:
  enabled: true
  allowFromNamespaces: []

autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 6
  targetCPUUtilizationPercentage: 60
  scaleDownStabilizationSeconds: 60

shutdown:
  preStopSleepSeconds: 5
  terminationGracePeriodSeconds: 30

topologySpread:
  enabled: false

route:
  enabled: false
  hostnames: []
  gateway:
    name: mission
    namespace: infra
  timeout: ""

# deployment: a plain Deployment. migrate: a Rollout takes over the Deployment's pods.
# rollout: a Rollout only.
workload: deployment

rollout:
  strategy: canary
  testerSeconds: 20
  stepSeconds: 45
  manualPause: false
  scaleDownDelaySeconds: 60

analysis:
  prometheusAddress: http://prometheus-server.monitoring.svc.cluster.local
  interval: 20s
  window: 40s
  minSuccessRate: 0.95
  maxP95Seconds: 0.25
  smokeImage: ""