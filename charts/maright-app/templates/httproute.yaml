{{- if .Values.route.enabled }}
{{- $name := include "maright-app.fullname" . }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ $name }}
  labels:
    {{- include "maright-app.labels" . | nindent 4 }}
spec:
  parentRefs:
    - name: {{ .Values.route.gateway.name }}
      namespace: {{ .Values.route.gateway.namespace }}
  hostnames:
    {{- toYaml .Values.route.hostnames | nindent 4 }}
  rules:
    - backendRefs:
        - name: {{ $name }}
          port: {{ .Values.service.port }}
          {{- if include "maright-app.isCanary" . }}
          weight: 100
        # The Rollout moves weight between these two during a canary.
        - name: {{ $name }}-canary
          port: {{ .Values.service.port }}
          weight: 0
          {{- end }}
      {{- with .Values.route.timeout }}
      timeouts:
        request: {{ . }}
      {{- end }}
{{- end }}
