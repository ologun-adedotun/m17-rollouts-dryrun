image:
  repository: ghcr.io/ologun-adedotun/m17-rollouts-dryrun/maright-app
  tag: v2.2.0
  pullPolicy: IfNotPresent

workload: deployment

config:
  APP_NAME: maright-app
  GREETING: Hello from production
  LOG_LEVEL: INFO
  READY_AFTER_SECONDS: "5"

networkPolicy:
  enabled: true
  allowFromNamespaces:
    - envoy-gateway-system
    - monitoring

route:
  enabled: true
  hostnames:
    - mission.local
  gateway:
    name: mission
    namespace: infra

rollout:
  strategy: canary
  testerSeconds: 20
  stepSeconds: 45
  manualPause: true
  scaleDownDelaySeconds: 60

analysis:
  prometheusAddress: http://prometheus-server.monitoring.svc.cluster.local
  interval: 20s
  window: 40s
  minSuccessRate: 0.95
  maxP95Seconds: 0.25
  smokeImage: ghcr.io/ologun-adedotun/m17-rollouts-dryrun/maright-k6:v1