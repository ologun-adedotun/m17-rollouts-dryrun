# Wave 0: one Application per folder under deploy/envs.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: mission
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  syncPolicy:
    # Never delete an Application because the generator stopped finding its folder:
    # removing an environment is a deliberate act, done by hand.
    applicationsSync: create-update
    # And if an Application is deleted, leave what it deployed running.
    preserveResourcesOnDeletion: true
  generators:
    - git:
        repoURL: https://github.com/ologun-adedotun/m17-rollouts-dryrun.git
        revision: main
        directories:
          - path: deploy/envs/*
  template:
    metadata:
      name: 'mission-{{.path.basename}}'
    spec:
      project: default
      source:
        repoURL: https://github.com/ologun-adedotun/m17-rollouts-dryrun.git
        targetRevision: main
        path: charts/maright-app
        helm:
          releaseName: mission
          valueFiles:
            - '../../deploy/envs/{{.path.basename}}/values.yaml'
      destination:
        server: https://kubernetes.default.svc
        namespace: '{{.path.basename}}'
      # During a canary the Rollout owns the route's weights and its header rule.
      ignoreDifferences:
        - group: gateway.networking.k8s.io
          kind: HTTPRoute
          jsonPointers:
            - /spec/rules
      syncPolicy:
        syncOptions:
          - RespectIgnoreDifferences=true
        automated:
          prune: true
          selfHeal: true
        retry:
          limit: 3
          backoff:
            duration: 10s
            factor: 2
            maxDuration: 1m
